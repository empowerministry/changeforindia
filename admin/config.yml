backend:
  name: git-gateway
  branch: main

# Where uploaded images will be stored
media_folder: "uploads"
public_folder: "/uploads"

# Define editable pages
collections:
  - name: "pages"
    label: "Pages"
    files:
      - label: "Home Page"
        name: "home"
        file: "pages/index.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "string", hint: "SEO meta description" }
          - { label: "Hero Image", name: "heroImage", widget: "image", hint: "Background image for the hero banner" }
          - { label: "Hero Title", name: "heroTitle", widget: "string", hint: "Large text displayed on the hero banner" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "string", hint: "Smaller text below the hero title" }
          - { label: "Body", name: "body", widget: "markdown" }

      - label: "Education"
        name: "education"
        file: "pages/education.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "string", hint: "SEO meta description" }
          - { label: "Hero Image", name: "heroImage", widget: "image" }
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
