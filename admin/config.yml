        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Page Content", name: "body", widget: "code", default_language: "html" }

      - label: "Gallery"
        name: "gallery"
        file: "gallery.html"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Page Content", name: "body", widget: "code", default_language: "html" }

      - label: "Get Involved"
        name: "get-involved"
        file: "get-involved.html"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Page Content", name: "body", widget: "code", default_language: "html" }

      - label: "Donate"
        name: "donate"
        file: "donate.html"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Page Content", name: "body", widget: "code", default_language: "html" }

      - label: "Contact"
